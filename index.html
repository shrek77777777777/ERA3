<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Заявка на заселение</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-6">

            <div class="card shadow">

                <div class="card-header bg-primary text-white text-center">
                    <h3 class="mb-0">
                        Заявка на заселение
                    </h3>
                </div>

                <div class="card-body">

                    <form id="dormForm">

                        <div class="mb-3">
                            <label for="studentId" class="form-label">
                                ID студента
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                id="studentId"
                                placeholder="Введите ID студента"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="buildingNumber" class="form-label">
                                Номер корпуса
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                id="buildingNumber"
                                placeholder="Введите номер корпуса"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="roomNumber" class="form-label">
                                Номер комнаты
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                id="roomNumber"
                                placeholder="Введите номер комнаты"
                                required
                            >
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Проверить заявку
                        </button>

                    </form>

                    <div id="result" class="mt-4"></div>

                </div>

                <div class="card-footer text-center text-secondary">
                    Система заявок на общежитие
                </div>

            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
